name: 构建并发布 Docker 镜像 (Build & Publish Docker Image)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-docker:
    name: 构建 Docker 镜像并推送至 GHCR
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 设置 Node.js 运行时
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 设置 pnpm 包管理器
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: 安装依赖并构建静态前端产物 (Build Vite)
        run: |
          cd v1.0.0
          pnpm install --frozen-lockfile=false
          pnpm run build

      - name: 登录 GitHub 镜像容器库 (Login to GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送到 GitHub 容器镜像库
        uses: docker/build-push-action@v5
        with:
          context: ./v1.0.0
          file: ./v1.0.0/docker/Dockerfile.quick
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v1.0.0
