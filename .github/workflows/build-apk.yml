name: 构建并发布安卓 APK (Build Android APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 编译 Android APK 安装包
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 设置 Node.js 运行时环境
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 设置 pnpm 包管理器
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: 设置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装前端依赖并构建生产静态资产
        run: |
          cd v1.0.0
          pnpm install --frozen-lockfile=false
          pnpm run build

      - name: 同步前端资产至 Capacitor 安卓原生工程
        run: |
          cd v1.0.0
          npx cap sync android

      - name: 给 Gradle 赋予可执行权限
        run: |
          chmod +x v1.0.0/android/gradlew

      - name: 执行 Gradle 编译构建 Android Debug APK
        run: |
          cd v1.0.0/android
          ./gradlew assembleDebug --stacktrace

      - name: 重命名 APK 文件为友好格式
        run: |
          mkdir -p build-output
          cp v1.0.0/android/app/build/outputs/apk/debug/app-debug.apk build-output/offline-idphoto-v1.0.0.apk

      - name: 上传构建产物 (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: offline-idphoto-v1.0.0-apk
          path: build-output/offline-idphoto-v1.0.0.apk
          retention-days: 30

      - name: 自动创建或更新 GitHub Release 发布
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: 离线证件照系统 Android APK 安装包
          body: |
            ### 📱 离线证件照制作与多人混排系统 - 安卓单机版 APK

            - **100% 离线端侧推理**：内置 MODNet 发丝级肖像精细抠图 AI 神经网络模型；
            - **零网络零流量**：无后端计算，支持断网/飞行模式下秒级抠图换底；
            - **支持多人多规格相纸混排打印**：支持 1寸、2寸、国考、教资标准尺寸及 6寸/A4 打印拼版；
            - **原生相机与相册**：免配置 SSL 证书，安装即用。
          files: build-output/offline-idphoto-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
