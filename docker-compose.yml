version: '3.8'

services:
  offline-idphoto:
    # 官方云端预编译镜像（由 GitHub Actions 自动编译，免除本地构建与源码依赖，开箱即用）
    image: ghcr.io/mysecret2022/offline-idphoto:latest
    container_name: offline-idphoto
    restart: always
    ports:
      - "8080:80"    # HTTP 访问入口，适合电脑本机使用：http://localhost:8080
      - "8443:443"   # HTTPS 访问入口，供局域网手机/iPad拍照使用：https://<您的NAS或电脑IP>:8443
    volumes:
      # SSL 证书持久化目录（容器启动时若为空将自动生成10年有效期自签证书）
      - ./certs:/etc/nginx/certs
    environment:
      - TZ=Asia/Shanghai
