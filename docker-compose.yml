version: '3.8'

services:
  offline-idphoto:
    build:
      context: ./v1.0.0
      dockerfile: docker/Dockerfile.quick
    container_name: offline-idphoto
    restart: always
    ports:
      # 宿主机端口 : 容器内部端口
      - "8080:80"    # HTTP 访问入口，适合本地电脑浏览器使用：http://localhost:8080
      - "8443:443"   # HTTPS 访问入口，供局域网手机/iPad拍照使用：https://<宿主机IP>:8443
    volumes:
      # SSL 证书持久化挂载目录
      # 若目录为空，容器首次启动时内置脚本会自动生成 10 年有效期的自签名证书
      # 若您有自己的域名证书，可将 cert.pem 和 key.pem 放入此目录实现无缝替换
      - ./v1.0.0/docker/certs:/etc/nginx/certs
    environment:
      - TZ=Asia/Shanghai
